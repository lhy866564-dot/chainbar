<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>链吧 · 好物 / 论坛 / 好友 / 设置</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand" data-nav="goods">
      <span class="logo">链</span>
      <div>
        <h1>链吧 ChainBar</h1>
        <p>好物 · 论坛 · 好友</p>
      </div>
    </div>
    <nav class="tabs">
      <button data-nav="goods" class="tab">好物</button>
      <button data-nav="forum" class="tab">论坛</button>
      <button data-nav="friends" class="tab">好友</button>
      <button data-nav="settings" class="tab">设置</button>
    </nav>
    <div class="userbox" id="userbox"></div>
  </header>

  <main id="view" class="view"></main>

  <div class="modal-mask hidden" id="authMask">
    <div class="modal">
      <h3 id="authTitle">登录链吧</h3>
      <label>用户名<input id="authUsername" placeholder="3-20 个字符" /></label>
      <label>昵称（注册时可填）<input id="authNickname" placeholder="留空则用用户名" /></label>
      <label>密码<input id="authPassword" type="password" placeholder="至少 6 位" /></label>
      <div class="modal-actions">
        <button class="ghost" id="authClose">取消</button>
        <button class="primary" id="authSubmit">登录</button>
        <button class="link" id="authSwitch">还没有账号？去注册</button>
      </div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/app.js"></script>
</body>
</html>
